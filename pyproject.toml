[project]
name = "running-coach"
version = "0.1.0"
description = "Personal running coach agent: Garmin sync, weekly reports, chat"
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.3.19",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coach = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config", "llm"]
packages = ["adapters", "db", "analysis", "reports", "delivery"]

[tool.setuptools.package-data]
db = ["schema.sql"]
reports = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
